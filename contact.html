<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Nexio</title>

  <!-- فونت‌ها -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-pV5hZ2lh5JOC+Jm9YvMT7j5j6K0qO5l6syw8JZjWQ6f+qXoDJYr8K3j0R1ohF/6+Pq6pHG0ZigqTvz1Ik0N5Xg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- استایل -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contianer">
    <nav>
      <!-- لوگو -->
      <div class="logo">Nexio</div>

      <!-- آیکون منو موبایل -->
      <span class="menu-toggle material-symbols-outlined">
        <span class="icon-text">menu</span>
      </span>

      <!-- منوی دسکتاپ -->
      <ul class="main-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <!-- منوی کناری موبایل -->
      <ul class="sidebar">
        <!-- دکمه ضربدر بالا گوشه -->
        <li class="close-menu-item">
          <button class="close-btn material-symbols-outlined">close</button>
        </li>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
<div class="contact-page">
    <div class="text-contact">
        <h1>Get In Touch</h1>
        <h4>Have a question or just want to say hi? Feel free to reach out anytime</h4>
    </div>
    <div class="btn-contact">
    <a href="https://t.me/Nexio_co" target="_blank" class="contact-btn telegram">
        <i class="fab fa-telegram-plane"></i> Join Telegram
    </a>
    <a href="https://www.instagram.com/nexio_co?igsh=dnZqcnVscWUxY3Zo" target="_blank" class="contact-btn instagram">
        <i class="fab fa-instagram"></i> DM on Instagram
    </a>
    <a href="mailto:sales.nexio@gmail.com" class="contact-btn email">
        <i class="fas fa-envelope"></i> Email Me
    </a>
</div>

  </div>
</div>
<script>
// منوی موبایل toggle
const menuToggle = document.querySelector('.menu-toggle');
const sidebar = document.querySelector('.sidebar');
const closeBtn = document.querySelector('.close-btn');

// باز کردن منو با آیکون همبرگری
menuToggle.addEventListener('click', () => {
  sidebar.classList.add('active');
});

// بستن منو با دکمه ضربدر
closeBtn.addEventListener('click', () => {
  sidebar.classList.remove('active');
});

// بستن منو با کلیک روی لینک‌ها
const sidebarLinks = sidebar.querySelectorAll('a');
sidebarLinks.forEach(link => {
  link.addEventListener('click', () => {
    sidebar.classList.remove('active');
  });
});
</script>
</body>
</html>
